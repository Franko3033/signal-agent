name: altFINS backtest

on:
  # "backtest-altfins-now.txt" o'zgarsa ishga tushadi (ichida: kunlar soni)
  push:
    paths:
      - backtest-altfins-now.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-altfins
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backtest
        env:
          ALTFINS_API_KEY: ${{ secrets.ALTFINS_API_KEY }}
        run: |
          DAYS=$(sed -n 1p backtest-altfins-now.txt | tr -dc 0-9)
          python backtest_altfins.py --days "${DAYS:-60}" | tee altfins_log.txt
      - name: Natijalarni saqlash
        if: always()
        run: |
          mkdir -p results
          tail -n 300 altfins_log.txt > results/altfins_log_tail.txt 2>/dev/null || true
          git config user.name "signal-agent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -q -m "altFINS backtest natijalari" && (git pull -q --rebase && git push -q) || true
